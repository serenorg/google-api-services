# ABOUTME: Builds and deploys the website technology service at the exact commit.
# ABOUTME: Pins the fingerprint source and binds the gateway secret from Secret Manager.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'RULES_COMMIT=9e52f10a9533c8f7f8d0703c843f7295d56c95a3'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:latest'
      - '-f'
      - 'tech_stack/Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:$COMMIT_SHA'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'seren-tech-stack'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:$COMMIT_SHA'
      - '--region=us-central1'
      - '--port=8009'
      - '--allow-unauthenticated'
      - '--set-secrets=GATEWAY_SECRET=tech-stack-gateway-secret:latest'
      - '--quiet'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-tech-stack:latest'
