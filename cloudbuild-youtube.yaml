# ABOUTME: Builds, pushes and deploys the exact YouTube publisher commit.
# ABOUTME: Binds the gateway and YouTube API credentials through Secret Manager.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:latest'
      - '-f'
      - 'youtube/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'seren-youtube'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:$COMMIT_SHA'
      - '--region=us-central1'
      - '--port=8007'
      - '--allow-unauthenticated'
      - '--set-secrets=GATEWAY_SECRET=youtube-gateway-secret:latest,YOUTUBE_API_KEY=youtube-api-key:latest'
      - '--quiet'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/google-api-services/seren-youtube:latest'
